<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Booking seasonality</title>
  <desc id="desc">Monthly booking profile with highlighted peaks.</desc>
  <rect width="960" height="600" fill="#0b1220" />
  <g transform="translate(90 90)">
    <rect x="0" y="0" width="780" height="380" rx="18" fill="#111827" stroke="#334155" />
    <g stroke="#1e293b" stroke-width="1">
      <line x1="0" y1="76" x2="780" y2="76" />
      <line x1="0" y1="152" x2="780" y2="152" />
      <line x1="0" y1="228" x2="780" y2="228" />
      <line x1="0" y1="304" x2="780" y2="304" />
    </g>
    <polyline points="20,270 90,250 160,230 230,200 300,160 370,120 440,110 510,130 580,170 650,190 720,220 760,250" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="440" cy="110" r="9" fill="#38bdf8" />
    <circle cx="510" cy="130" r="9" fill="#38bdf8" />
    <text x="18" y="344" fill="#94a3b8" font-size="20" font-family="Arial, sans-serif">Jan</text>
    <text x="360" y="344" fill="#94a3b8" font-size="20" font-family="Arial, sans-serif">Jun</text>
    <text x="710" y="344" fill="#94a3b8" font-size="20" font-family="Arial, sans-serif">Dec</text>
  </g>
  <text x="90" y="540" fill="#e2e8f0" font-size="34" font-family="Arial, sans-serif">Seasonality changes inventory pressure</text>
</svg>

