<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Cancellation risk signal</title>
  <desc id="desc">Reservations funnel and cancellation risk gauge.</desc>
  <rect width="960" height="600" fill="#0f172a" />
  <g transform="translate(90 90)">
    <rect x="0" y="0" width="360" height="92" rx="12" fill="#1e3a8a" />
    <rect x="36" y="118" width="288" height="92" rx="12" fill="#1d4ed8" />
    <rect x="72" y="236" width="216" height="92" rx="12" fill="#2563eb" />
    <rect x="108" y="354" width="144" height="92" rx="12" fill="#60a5fa" />
    <text x="18" y="58" fill="#e2e8f0" font-size="24" font-family="Arial, sans-serif">Reservations</text>
    <text x="410" y="270" fill="#e2e8f0" font-size="28" font-family="Arial, sans-serif">Cancellation risk</text>
    <path d="M430 340 A140 140 0 0 1 710 340" fill="none" stroke="#334155" stroke-width="24" />
    <path d="M430 340 A140 140 0 0 1 650 250" fill="none" stroke="#f97316" stroke-width="24" />
    <line x1="570" y1="340" x2="650" y2="250" stroke="#fb923c" stroke-width="6" />
    <circle cx="570" cy="340" r="10" fill="#fb923c" />
    <text x="445" y="390" fill="#94a3b8" font-size="20" font-family="Arial, sans-serif">Low</text>
    <text x="682" y="390" fill="#94a3b8" font-size="20" font-family="Arial, sans-serif">High</text>
  </g>
  <text x="90" y="540" fill="#e2e8f0" font-size="34" font-family="Arial, sans-serif">Forecasting cancellations reduces overbooking risk</text>
</svg>

